name: Release Windows portable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-alpha.*"

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare isolated build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,excel,web]" pyinstaller

      - name: Verify deterministic engine
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Build portable folder
        shell: pwsh
        run: .\scripts\build_windows_portable.ps1

      - name: Resolve release metadata
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VERSION_NAME=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_NAME=FinCompiler-$version-windows-x64-portable.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package and hash
        shell: pwsh
        run: |
          $name = $env:PACKAGE_NAME
          Compress-Archive -LiteralPath "dist-windows\FinCompiler" -DestinationPath $name -CompressionLevel Optimal
          (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + $name | Set-Content -LiteralPath "$name.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: FinCompiler-${{ github.ref_name }}-windows-x64-portable
          path: |
            ${{ env.PACKAGE_NAME }}
            ${{ env.PACKAGE_NAME }}.sha256

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/RELEASE_NOTES_$env:VERSION_NAME.md"
          $assets = @($env:PACKAGE_NAME, "$env:PACKAGE_NAME.sha256")

          if (gh release view $env:TAG_NAME *> $null) {
            gh release upload $env:TAG_NAME @assets --clobber
            gh release edit $env:TAG_NAME --title "FinCompiler $env:TAG_NAME" --prerelease
          }
          elseif (Test-Path -LiteralPath $notes) {
            gh release create $env:TAG_NAME @assets --title "FinCompiler $env:TAG_NAME" --notes-file $notes --prerelease
          }
          else {
            gh release create $env:TAG_NAME @assets --title "FinCompiler $env:TAG_NAME" --generate-notes --prerelease
          }
