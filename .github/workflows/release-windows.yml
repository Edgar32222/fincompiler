name: Release Windows portable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-alpha.*"

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare isolated build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,excel,web]" pyinstaller

      - name: Verify deterministic engine
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Build portable folder
        shell: pwsh
        run: .\scripts\build_windows_portable.ps1

      - name: Package and hash
        shell: pwsh
        run: |
          $name = "FinCompiler-0.7.0-alpha.1-windows-x64-portable.zip"
          Compress-Archive -LiteralPath "dist-windows\FinCompiler" -DestinationPath $name -CompressionLevel Optimal
          (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + $name | Set-Content -LiteralPath "$name.sha256" -Encoding ascii

      - name: Publish private-alpha release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.7.0-alpha.1" `
            "FinCompiler-0.7.0-alpha.1-windows-x64-portable.zip" `
            "FinCompiler-0.7.0-alpha.1-windows-x64-portable.zip.sha256" `
            --title "FinCompiler v0.7.0-alpha.1" `
            --notes-file "docs/RELEASE_NOTES_0.7.0-alpha.1.md" `
            --prerelease
