[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fincompiler"
version = "0.7.0a1"
description = "Local-first deterministic finance compilation and investigation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.2.2", "openpyxl>=3.1"]

[project.optional-dependencies]
web = ["streamlit>=1.32"]
excel = []
dev = ["pytest>=8"]

[project.scripts]
fincompiler = "fincompiler.cli:main"
fincompiler-web = "fincompiler.web:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fincompiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
